openapi: 3.0.3
info:
  title: SmartRoad API
  version: 1.0.0
  description: Dokumentasi interaktif REST API SmartRoad. Gunakan tombol Authorize untuk memasukkan JWT.
servers:
  - url: /
    description: Server SmartRoad aktif
tags:
  - name: Authentication
  - name: Profile
  - name: Reports
  - name: Admin
  - name: Petugas
  - name: Customer Service
  - name: Notifications
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Registrasi akun baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, email, password, confirm_password]
              properties:
                nama: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                confirm_password: { type: string, format: password }
      responses:
        '200': { description: Registrasi berhasil }
        '400': { description: Data tidak valid }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login dan dapatkan JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Login berhasil }
        '401': { description: Email atau password salah }
  /api/profile/user-profile:
    get:
      tags: [Profile]
      summary: Ambil profil pengguna
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Profil pengguna }
        '401': { description: Token tidak valid }
  /api/profile/update-profile:
    post:
      tags: [Profile]
      summary: Perbarui profil pengguna
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama]
              properties:
                nama: { type: string, example: Budi Santoso }
                telepon: { type: string, example: '081234567890' }
                alamat: { type: string, example: Jakarta }
      responses:
        '200': { description: Profil diperbarui }
  /api/profile/update-password:
    post:
      tags: [Profile]
      summary: Ubah password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  format: password
                  description: Password akun saat ini
                  example: password_lama
                new_password:
                  type: string
                  format: password
                  description: Password baru yang akan digunakan
                  example: password_baru
      responses:
        '200': { description: Password diperbarui }
  /api/profile/upload-photo:
    post:
      tags: [Profile]
      summary: Unggah foto profil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: Gambar JPG, PNG, atau WEBP maksimal 5 MB
      responses:
        '200': { description: Foto berhasil diunggah }
  /api/reports/public-summary:
    get:
      tags: [Reports]
      summary: Ringkasan laporan publik
      responses:
        '200': { description: Ringkasan laporan }
  /api/reports/submit:
    post:
      tags: [Reports]
      summary: Kirim laporan kerusakan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, photo]
              properties:
                title: { type: string, example: Jalan berlubang besar }
                address: { type: string, example: Jl. Merdeka No. 10 }
                province: { type: string, example: DKI Jakarta }
                city: { type: string, example: Jakarta Pusat }
                district: { type: string, example: Gambir }
                category: { type: string, example: Jalan Berlubang }
                hazard_level: { type: string, example: Tinggi }
                dimensions: { type: string, example: 100 x 80 cm }
                description: { type: string, example: Lubang membahayakan pengendara. }
                lat: { type: number, format: double, example: -6.1754 }
                lng: { type: number, format: double, example: 106.8272 }
                photo:
                  type: string
                  format: binary
                  description: Foto bukti kerusakan
      responses:
        '200': { description: Laporan dikirim }
  /api/reports/user:
    get:
      tags: [Reports]
      summary: Riwayat laporan pengguna
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar laporan pengguna }
  /api/reports/{report_id}/review:
    post:
      tags: [Reports]
      summary: Kirim ulasan laporan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/reportId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, review_text]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
                review_text: { type: string, maxLength: 500, example: Perbaikan jalan sangat baik. }
                reviewer_name: { type: string, example: Budi Santoso }
      responses:
        '200': { description: Ulasan tersimpan }
  /api/reports/all:
    get:
      tags: [Admin]
      summary: Ambil seluruh laporan
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Seluruh laporan }
        '403': { description: Khusus admin }
  /api/reports/{report_id}/status:
    put:
      tags: [Admin]
      summary: Ubah status dan petugas laporan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/reportId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Menunggu, Proses, Selesai] }
                assigned_petugas_email: { type: string, format: email }
      responses:
        '200': { description: Status diperbarui }
  /api/admin/dashboard-stats:
    get:
      tags: [Admin]
      summary: Statistik dashboard admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Statistik dashboard }
  /api/admin/users:
    get:
      tags: [Admin]
      summary: Daftar seluruh pengguna
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar pengguna }
  /api/admin/petugas:
    get:
      tags: [Admin]
      summary: Daftar petugas
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar petugas }
  /api/reports/assigned:
    get:
      tags: [Petugas]
      summary: Daftar tugas petugas
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar tugas }
  /api/reports/{report_id}/complete:
    post:
      tags: [Petugas]
      summary: Selesaikan laporan dan unggah bukti
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/reportId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                completion_note:
                  type: string
                  example: Lubang sudah ditambal dan area telah dibersihkan.
                photo:
                  type: string
                  format: binary
                  description: Foto bukti perbaikan JPG, PNG, atau WEBP maksimal 5 MB
      responses:
        '200': { description: Laporan diselesaikan }
  /api/reports/cs/conversations:
    get:
      tags: [Customer Service]
      summary: Daftar percakapan CS
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar percakapan }
  /api/reports/{report_id}/cs-messages:
    get:
      tags: [Customer Service]
      summary: Ambil pesan CS
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/reportId' }]
      responses:
        '200': { description: Daftar pesan }
    post:
      tags: [Customer Service]
      summary: Kirim pesan CS
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/reportId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 1000, example: Mohon informasi perkembangan laporan ini. }
                sender_name: { type: string, example: Budi Santoso }
      responses:
        '200': { description: Pesan terkirim }
  /api/reports/notifications/user:
    get:
      tags: [Notifications]
      summary: Ambil notifikasi pengguna
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar notifikasi }
  /api/reports/notifications/user/read:
    put:
      tags: [Notifications]
      summary: Tandai notifikasi telah dibaca
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Notifikasi ditandai dibaca }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan access token dari endpoint login.
  parameters:
    reportId:
      name: report_id
      in: path
      required: true
      description: ID laporan MongoDB
      schema: { type: string }
