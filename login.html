<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SmartRoad</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="auth-card">
            <div class="text-center mb-5">
                <a href="index.html" class="navbar-brand fs-3 mb-3 justify-content-center d-flex align-items-center">
                    <div class="bg-primary-light p-2 rounded-md me-2">
                        <i data-lucide="map-pinned" class="icon text-primary"></i>
                    </div>
                    SmartRoad
                </a>
                <h4 class="fw-bold mb-2">Selamat Datang Kembali</h4>
                <p class="text-muted">Masuk ke akun Anda untuk melanjutkan.</p>
            </div>
            
            <form class="needs-validation" novalidate action="dashboard-user.html">
                <div class="mb-4">
                    <label for="email" class="form-label fw-medium text-dark">Alamat Email</label>
                    <div class="position-relative">
                        <div class="position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">
                            <i data-lucide="mail" style="width: 18px; height: 18px;"></i>
                        </div>
                        <input type="email" class="form-control" style="padding-left: 2.5rem;" id="email" placeholder="nama@email.com" required>
                    </div>
                    <div class="invalid-feedback">
                        Harap masukkan alamat email yang valid.
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="password" class="form-label fw-medium text-dark mb-0">Kata Sandi</label>
                        <a href="#" class="text-primary text-decoration-none small fw-medium">Lupa sandi?</a>
                    </div>
                    <div class="position-relative">
                        <div class="position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">
                            <i data-lucide="lock" style="width: 18px; height: 18px;"></i>
                        </div>
                        <input type="password" class="form-control" style="padding-left: 2.5rem;" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="invalid-feedback">
                        Harap masukkan kata sandi Anda.
                    </div>
                </div>
                
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label text-muted ms-1" for="rememberMe">Ingat Saya</label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-4 py-2">
                    Masuk Sekarang <i data-lucide="arrow-right" class="ms-1" style="width: 18px; height: 18px;"></i>
                </button>
                
                <div class="text-center">
                    <p class="text-muted mb-0">Belum punya akun? <a href="register.html" class="text-primary fw-medium text-decoration-none">Daftar di sini</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
